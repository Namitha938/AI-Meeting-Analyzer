services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: meetora-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meetora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meetora123}
      POSTGRES_DB: ${POSTGRES_DB:-meetora_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meetora} -d ${POSTGRES_DB:-meetora_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: meetora-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: meetora-minio-s3
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-meetora_admin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-meetora_secret_key_123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meetora-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://meetora:meetora123@postgres:5432/meetora_db
      REDIS_URL: redis://redis:6379/0
      LIVEKIT_URL: ${LIVEKIT_URL:-wss://meeting-analyzer-q8ttw70p.livekit.cloud}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-APIopUuPWKCqTmn}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-ZZI3iY2Aa2mj0i0yHN9E2TKGUIiZtiYPyZNChf7fZpW}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meetora-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  redis_data:
  minio_data:
